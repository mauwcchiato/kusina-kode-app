name: Android unit tests

# Runs the JVM unit tests (the 153-test suite, ./gradlew testDebugUnitTest) on
# every push to main and every pull request. Instrumented tests
# (connectedAndroidTest) are NOT run here - they need a device/emulator; add an
# emulator job later if that coverage is wanted.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel an in-progress run if a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # No keystore.properties in CI: build.gradle.kts falls back to the debug
      # signing config, which is all the unit tests need. No secrets required.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Publish the HTML + XML report so a failure is inspectable from the run.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
